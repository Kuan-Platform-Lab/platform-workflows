# Reusable CI/CD cho service Java/Gradle: test -> build+scan -> push GHCR -> cập nhật platform-gitops.
# Gọi từ repo app:  uses: Kuan-Platform-Lab/platform-workflows/.github/workflows/java-service.yaml@main
name: java-service

on:
  workflow_call:
    inputs:
      service:
        description: Tên service = tên image = thư mục apps/<service> trong platform-gitops
        type: string
        required: true
      java-version:
        type: string
        default: '21'
      gitops-repo:
        type: string
        default: Kuan-Platform-Lab/platform-gitops
    secrets:
      GITOPS_TOKEN:
        description: Fine-grained PAT (hoặc GitHub App token) chỉ có quyền ghi repo platform-gitops
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }          # gitleaks quét cả lịch sử commit

      - name: gitleaks (secret scan)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --no-banner --redact --verbose .
          rm gitleaks

      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '${{ inputs.java-version }}' }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check --no-daemon

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta                           # GHCR bắt buộc tên image viết thường
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build (amd64, nạp vào docker local để scan trước khi push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fail nếu có CVE HIGH/CRITICAL đã có bản vá)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          artifact-name: sbom-${{ inputs.service }}.spdx.json
          format: spdx-json

  publish:
    # chỉ chạy khi merge vào main, không chạy trên PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                      # push GHCR bằng GITHUB_TOKEN, không cần PAT
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push đa kiến trúc (amd64 + arm64 cho OCI Ampere)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  update-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image, publish]
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-update                 # tránh hai service push chồng lên nhau
      cancel-in-progress: false
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Kiểm tra có token
        if: env.GITOPS_TOKEN == ''
        run: echo "::warning::GITOPS_TOKEN chưa được cấu hình, bỏ qua bước cập nhật platform-gitops"
      - uses: actions/checkout@v7
        if: env.GITOPS_TOKEN != ''
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Cập nhật tag image ở dev
        if: env.GITOPS_TOKEN != ''
        run: |
          f="apps/${{ inputs.service }}/values-dev.yaml"
          test -f "$f" || { echo "::error::không thấy $f"; exit 1; }
          yq -i '.image.repository = "${{ needs.image.outputs.image }}" | .image.tag = "${{ needs.image.outputs.tag }}"' "$f"
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          if git diff --quiet; then echo "không có thay đổi"; exit 0; fi
          git commit -am "chore(${{ inputs.service }}): deploy ${{ needs.image.outputs.tag }} to dev"
          for _ in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
